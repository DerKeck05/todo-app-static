<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header>
    <div id="logo">
        <img src="assets/img/logo.svg" alt="To-Do App Logo"/>
        <h1>To-Do App</h1>
    </div>
    <form id="new-task-form">
        <label for="new-task-text"></label><input type="text" id="new-task-text" placeholder="Was hast du geplant?"/>
        <input type="submit" id="new-task-submit" value="Speichern"/>
    </form>
</header>
<main>
    <h2>Tasks</h2>
    <div id="tasks">
        <div class="tasks">
            <label>
                <input type="text" class="text" value="Kirschen kaufen"/>
            </label>
            <div class="task-actions">
                <button class="edit">Bearbeiten</button>
                <button class="delete">Löschen</button>
            </div>
        </div>
    </div>
</main>
</body>
</html>
